name: llvm-mos

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-mos-toolchain:
    runs-on: ubuntu-latest
    env:
      SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SCCACHE_REGION: ${{ secrets.SCCACHE_REGION }}

    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          meson \
          build-essential \
          git \
          zip

        # Verify installations
        cmake --version
        ninja --version
        meson --version
        python3 --version

    - name: Install sccache from GitHub releases
      run: |
        echo "::group::Download sccache v0.12.0"
        curl -L https://github.com/mozilla/sccache/releases/download/v0.12.0/sccache-v0.12.0-x86_64-unknown-linux-musl.tar.gz -o sccache.tar.gz
        echo "::endgroup::"

        echo "::group::Install sccache"
        tar -xzf sccache.tar.gz
        sudo mv sccache-v0.12.0-x86_64-unknown-linux-musl/sccache /usr/local/bin/
        sudo chmod +x /usr/local/bin/sccache
        rm -rf sccache.tar.gz sccache-v0.12.0-x86_64-unknown-linux-musl
        echo "::endgroup::"

        # Verify installation
        sccache --version

    - name: Check sccache configuration
      run: |
        # Explicitly mask secrets to prevent accidental exposure
        if [ -n "$AWS_ACCESS_KEY_ID" ]; then
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
        fi
        if [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
        fi

        if [ -n "$SCCACHE_BUCKET" ]; then
          echo "✓ sccache S3 backend configured"
          echo "  Bucket: $SCCACHE_BUCKET"
          echo "  Region: $SCCACHE_REGION"

          # Start sccache server with S3 configuration
          echo "Starting sccache server..."
          sccache --start-server
        else
          echo "○ sccache will use local disk cache"
        fi

        # Show sccache stats
        echo ""
        sccache --show-stats

    - name: Clone and build llvm-mos
      run: |
        echo "::group::Clone llvm-mos"
        git clone https://github.com/johnwbyrd/llvm-mos.git
        cd llvm-mos
        LLVM_MOS_COMMIT=$(git rev-parse --short HEAD)
        echo "llvm-mos commit: $LLVM_MOS_COMMIT"
        echo "LLVM_MOS_COMMIT=$LLVM_MOS_COMMIT" >> $GITHUB_ENV
        echo "::endgroup::"

        echo "::group::Configure llvm-mos"
        cmake -C clang/cmake/caches/MOS.cmake \
          -G Ninja \
          -S llvm \
          -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/llvm-mos-install \
          -DCMAKE_C_COMPILER_LAUNCHER=sccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
        echo "::endgroup::"

        echo "::group::Build llvm-mos"
        cmake --build build --target distribution
        echo "::endgroup::"

        echo "::group::Install llvm-mos"
        cmake --build build --target install-distribution-stripped
        echo "::endgroup::"

        # Verify installation
        ls -la ${{ github.workspace }}/llvm-mos-install/bin/
        ${{ github.workspace }}/llvm-mos-install/bin/mos-clang --version

    - name: Checkout picolibc
      uses: actions/checkout@v4
      with:
        path: picolibc

    - name: Build picolibc for MOS
      run: |
        # Set up environment variables
        export PATH="${{ github.workspace }}/llvm-mos-install/bin:$PATH"
        export LLVM_MOS="${{ github.workspace }}/llvm-mos-install"
        export PICOLIBC_MOS_PREFIX="${{ github.workspace }}/picolibc-install"

        echo "::group::Environment verification"
        echo "PATH: $PATH"
        echo "LLVM_MOS: $LLVM_MOS"
        echo "PICOLIBC_MOS_PREFIX: $PICOLIBC_MOS_PREFIX"
        which mos-clang
        mos-clang --version
        echo "::endgroup::"

        echo "::group::Configure picolibc"
        cd picolibc
        PICOLIBC_COMMIT=$(git rev-parse --short HEAD)
        echo "picolibc commit: $PICOLIBC_COMMIT"
        echo "PICOLIBC_COMMIT=$PICOLIBC_COMMIT" >> $GITHUB_ENV
        mkdir -p build
        cd build
        ../scripts/do-mos-configure .
        echo "::endgroup::"

        echo "::group::Build picolibc"
        ninja
        echo "::endgroup::"

        echo "::group::Install picolibc"
        ninja install
        echo "::endgroup::"

        # Verify picolibc installation
        echo "::group::Verify picolibc installation"
        ls -la ${{ github.workspace }}/picolibc-install/
        if [ -d "${{ github.workspace }}/picolibc-install/lib" ]; then
          ls -la ${{ github.workspace }}/picolibc-install/lib/ | head -20
        fi
        if [ -d "${{ github.workspace }}/picolibc-install/include" ]; then
          ls -la ${{ github.workspace }}/picolibc-install/include/ | head -20
        fi
        echo "::endgroup::"

    - name: Package LLVM-MOS
      run: |
        cd ${{ github.workspace }}

        BUILD_DATE=$(date +%Y%m%d)
        LLVM_MOS_NAME="llvm-mos-linux-x86_64-${BUILD_DATE}-${{ env.LLVM_MOS_COMMIT }}"

        echo "::group::Create LLVM-MOS package"
        mkdir -p $LLVM_MOS_NAME
        cp -r llvm-mos-install/* $LLVM_MOS_NAME/

        echo "::endgroup::"

        echo "::group::Create LLVM-MOS archive"
        zip -r ${LLVM_MOS_NAME}.zip $LLVM_MOS_NAME
        ls -lh ${LLVM_MOS_NAME}.zip
        echo "LLVM-MOS archive size: $(du -h ${LLVM_MOS_NAME}.zip | cut -f1)"
        echo "::endgroup::"

        echo "LLVM_MOS_ARCHIVE=${LLVM_MOS_NAME}.zip" >> $GITHUB_ENV
        echo "LLVM_MOS_NAME=${LLVM_MOS_NAME}" >> $GITHUB_ENV

    - name: Package Picolibc
      run: |
        cd ${{ github.workspace }}

        BUILD_DATE=$(date +%Y%m%d)
        PICOLIBC_NAME="picolibc-mos-${BUILD_DATE}-${{ env.PICOLIBC_COMMIT }}"

        echo "::group::Create Picolibc package"
        mkdir -p $PICOLIBC_NAME
        cp -r picolibc-install/* $PICOLIBC_NAME/

        echo "::endgroup::"

        echo "::group::Create Picolibc archive"
        zip -r ${PICOLIBC_NAME}.zip $PICOLIBC_NAME
        ls -lh ${PICOLIBC_NAME}.zip
        echo "Picolibc archive size: $(du -h ${PICOLIBC_NAME}.zip | cut -f1)"
        echo "::endgroup::"

        echo "PICOLIBC_ARCHIVE=${PICOLIBC_NAME}.zip" >> $GITHUB_ENV
        echo "PICOLIBC_NAME=${PICOLIBC_NAME}" >> $GITHUB_ENV

    - name: Upload LLVM-MOS artifact
      uses: actions/upload-artifact@v5
      with:
        name: ${{ env.LLVM_MOS_NAME }}
        path: ${{ env.LLVM_MOS_ARCHIVE }}
        retention-days: 90
        if-no-files-found: error
        compression-level: 9

    - name: Upload Picolibc artifact
      uses: actions/upload-artifact@v5
      with:
        name: ${{ env.PICOLIBC_NAME }}
        path: ${{ env.PICOLIBC_ARCHIVE }}
        retention-days: 90
        if-no-files-found: error
        compression-level: 9

    - name: Create build summary
      run: |
        cd ${{ github.workspace }}

        echo "## MOS Toolchain Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Two separate packages have been built:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### LLVM-MOS Compiler" >> $GITHUB_STEP_SUMMARY
        echo "**Archive:** \`${{ env.LLVM_MOS_ARCHIVE }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Size:** $(du -h ${{ env.LLVM_MOS_ARCHIVE }} | cut -f1)" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ env.LLVM_MOS_COMMIT }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Picolibc C Library" >> $GITHUB_STEP_SUMMARY
        echo "**Archive:** \`${{ env.PICOLIBC_ARCHIVE }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Size:** $(du -h ${{ env.PICOLIBC_ARCHIVE }} | cut -f1)" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ env.PICOLIBC_COMMIT }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Usage" >> $GITHUB_STEP_SUMMARY
        echo "1. Download both artifacts" >> $GITHUB_STEP_SUMMARY
        echo "2. Extract both zip files" >> $GITHUB_STEP_SUMMARY
        echo "3. Add llvm-mos bin/ to PATH" >> $GITHUB_STEP_SUMMARY
        echo "4. Use --sysroot to point to picolibc directory" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build Date:** $(date)" >> $GITHUB_STEP_SUMMARY